<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#071a13">

    <title>Offline | NutriX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #071a13;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .offline-card {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            margin: 0;
            line-height: 1.6;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="offline-card">

        <img
            src="./assets/images/nutrix-logo.png"
            alt="NutriX"
            class="logo"
        >

        <h1>You're Offline</h1>

        <p>
            No internet connection is available right now.
            Please reconnect and try again.
        </p>

    </div>

</body>
</html>
